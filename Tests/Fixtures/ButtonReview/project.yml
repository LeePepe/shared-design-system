name: ButtonReview
options:
  bundleIdPrefix: org.nativedesignkit.fixtures
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  NativeDesignKit:
    path: ../../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  ButtonReview:
    type: application
    platform: iOS
    sources: [App, ../Shared/StrataSpecimen.swift]
    dependencies:
      - package: NativeDesignKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nativedesignkit.fixtures.ButtonReview
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  ButtonReviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ButtonReview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nativedesignkit.fixtures.ButtonReviewUITests
        TEST_TARGET_NAME: ButtonReview
  ButtonReviewMac:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources: [App, ../Shared/StrataSpecimen.swift]
    dependencies:
      - package: NativeDesignKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nativedesignkit.fixtures.ButtonReviewMac
  ButtonPointerReviewUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "12.0"
    sources: [PointerTests]
    dependencies:
      - target: ButtonReviewMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nativedesignkit.fixtures.ButtonPointerReviewUITests
        TEST_TARGET_NAME: ButtonReviewMac
schemes:
  ButtonReview:
    build:
      targets:
        ButtonReview: all
        ButtonReviewUITests: [test]
    test:
      gatherCoverageData: false
      targets: [ButtonReviewUITests]
  ButtonReviewMac:
    build:
      targets:
        ButtonReviewMac: all
        ButtonPointerReviewUITests: [test]
    test:
      gatherCoverageData: false
      targets: [ButtonPointerReviewUITests]
