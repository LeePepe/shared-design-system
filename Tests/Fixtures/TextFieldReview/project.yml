name: TextFieldReview
options:
  bundleIdPrefix: org.nativedesignkit.fixtures
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  NativeDesignKit:
    path: ../../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  TextFieldReview:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: NativeDesignKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nativedesignkit.fixtures.TextFieldReview
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  TextFieldReviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TextFieldReview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nativedesignkit.fixtures.TextFieldReviewUITests
        TEST_TARGET_NAME: TextFieldReview
schemes:
  TextFieldReview:
    build:
      targets:
        TextFieldReview: all
        TextFieldReviewUITests: [test]
    test:
      gatherCoverageData: false
      targets: [TextFieldReviewUITests]
