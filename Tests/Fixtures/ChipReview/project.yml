name: ChipReview
options:
  bundleIdPrefix: org.nativedesignkit.fixtures
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  NativeDesignKit:
    path: ../../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  ChipReview:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: NativeDesignKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nativedesignkit.fixtures.ChipReview
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  ChipReviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ChipReview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nativedesignkit.fixtures.ChipReviewUITests
        TEST_TARGET_NAME: ChipReview
schemes:
  ChipReview:
    build:
      targets:
        ChipReview: all
        ChipReviewUITests: [test]
    test:
      gatherCoverageData: false
      targets: [ChipReviewUITests]
